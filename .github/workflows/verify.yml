# Verification for Packet Defense.
#
# Why this exists: every check in this project already existed and every one of
# them was run by hand, by whoever remembered to run it. That is the most likely
# way this project regresses - somebody changes one dial, the campaign's 240
# measured tickets move, and nothing says so. The checks were never the problem;
# remembering them was.
#
# One entry point, tools/verify.js, so that CI and a person run exactly the same
# thing and "verified" cannot come to mean two different things.
#
# Two jobs, on purpose:
#
#   verify   ten seconds. Runs on every push and pull request that touches the
#            game, so feedback arrives while the change is still in mind.
#   full     the whole 240-ticket campaign plus the difficulty measurement.
#            Several minutes, so it runs on main and on tags rather than on every
#            intermediate commit - but it is the one that would catch a subtle
#            balance regression, so it must run before anything ships.

name: verify

on:
  push:
    branches: [main]
    paths:
      - 'packet-defense/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'packet-defense/**'
      - '.github/workflows/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: packet-defense

jobs:
  verify:
    name: fast gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by the project's own .nvmrc, which is 22 because Capacitor 8
      # requires it. Reading the file rather than hardcoding the number here
      # means the two cannot disagree.
      - uses: actions/setup-node@v4
        with:
          node-version-file: packet-defense/.nvmrc
          cache: npm
          cache-dependency-path: packet-defense/package-lock.json

      # ci, not install: the lockfile is committed and the build should fail on a
      # mismatch rather than quietly resolve something else.
      - run: npm ci

      - name: syntax, backlog, assets, relay, invariants, replay
        run: node tools/verify.js

  full:
    name: full campaign
    runs-on: ubuntu-latest
    # Not on every intermediate commit: this one takes minutes and the answer
    # does not change between two commits that touch a comment.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packet-defense/.nvmrc
          cache: npm
          cache-dependency-path: packet-defense/package-lock.json

      - run: npm ci

      - name: all 240 tickets, and what the first ten cost
        run: node tools/verify.js --full

      # The measurement the balance report exists for, kept as an artifact so a
      # regression can be read rather than guessed at. A diff of two of these is
      # how a change to the curve is understood.
      - name: full balance report
        run: node tools/balance.js > /tmp/balance-report.txt
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: /tmp/balance-report.txt
          if-no-files-found: warn

# =============================================================================
#  Gaming — deploy manifest (single source of truth for the staging deploy)
# =============================================================================
#
#  Format (pipe separated, one app per line):
#
#     name | project dir | internal port | public port | display label | relay port
#
#     name           stable id, used for the systemd unit and nginx site names
#     project dir    folder inside the repo that owns tools/serve.js + www/
#     internal port  loopback-only port the game's static server binds to
#     public port    port nginx listens on, reachable from the internet
#     display label  friendly name shown in menus and the deploy summary
#     relay port     loopback-only port for the co-op relay, or empty for none
#
#  Adding a third game = add one line here. Nothing else to edit.
#
#  Port map on the remote host (keep in sync with the notes in README.md):
#     80   -> existing "seo-agachi" nginx site   (DO NOT TOUCH)
#     3001 -> existing seo-agachi session API    (DO NOT TOUCH)
#   8081   -> Neon Stack        (public, basic auth)  -> 127.0.0.1:9081
#   8082   -> Packet Defense    (public, basic auth)  -> 127.0.0.1:9082
#   9083   -> Packet Defense co-op relay             (loopback only)
#
#  The relay is loopback-only and reached through the game's own origin at
#  /coop/. It is never given a public port of its own: the game's CSP is
#  `connect-src 'self'`, so a second origin would not be reachable anyway, and
#  opening a port nothing needs is how a shared box slowly becomes a mess.
# =============================================================================

neon-stack     | neon-stack     | 9081 | 8081 | Neon Stack     |
packet-defense | packet-defense | 9082 | 8082 | Packet Defense | 9083

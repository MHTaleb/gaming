<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runtime Zero — Backlog</title>
<meta name="robots" content="noindex, nofollow" />
<!-- The board is a development tool. It reads backlog.json from its own
     directory, so the only origin it needs is this one. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
<link rel="stylesheet" href="board.css" />
</head>
<body>

<header class="top">
  <div class="top-left">
    <h1>Runtime Zero</h1>
    <p class="sub" id="meta-line">loading…</p>
  </div>

  <div class="top-right">
    <label class="search">
      <span class="visually-hidden">Search the backlog</span>
      <input type="search" id="search" placeholder="search title, summary, tag…" autocomplete="off" spellcheck="false" />
    </label>
    <button class="btn" id="toggle-filters" aria-pressed="true" aria-controls="filter-rows">filters</button>
    <button class="btn" id="toggle-dropped" aria-pressed="false">show dropped</button>
    <button class="btn" id="reset">reset</button>
  </div>
</header>

<section class="progress" id="progress" aria-label="Progress by status"></section>

<section class="filters" aria-label="Filters" id="filters">
  <div id="filter-rows">
    <div class="filter-row">
      <span class="filter-label">priority</span>
      <div class="chips" id="chips-priority"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">epic</span>
      <div class="chips" id="chips-epic"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">area</span>
      <div class="chips" id="chips-area"></div>
    </div>
    <div class="filter-row" id="tag-row">
      <span class="filter-label">tag</span>
      <div class="chips" id="chips-tag"></div>
    </div>
  </div>
</section>

<main class="board" id="board" aria-label="Backlog columns"></main>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Item detail">
  <div class="drawer-inner" id="drawer-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<footer class="foot">
  <span id="foot-count"></span>
  <span>data: <code>backlog/backlog.json</code> · validate with <code>node tools/backlog.js</code></span>
</footer>

<script src="board.js"></script>
</body>
</html>

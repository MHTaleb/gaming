<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Packet Defense - hold the production server against everything the internet throws at it." />
<!--
  Strict CSP. Everything is a local file and every script is external, so inline
  script is forbidden outright, which is what stops injected script from doing
  anything useful. Inline style is forbidden too, so all dynamic presentation
  goes through CSSOM or classes.

  Add your purchase validator origin to connect-src when you deploy it:
    connect-src 'self' https://your-validator.example.com
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
<title>Packet Defense</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- ------------------------------- menu ------------------------------- -->
  <section id="screen-menu" class="screen"></section>

  <!-- ---------------------------- level select --------------------------- -->
  <section id="screen-map" class="screen"></section>

  <!-- ------------------------------ briefing ---------------------------- -->
  <section id="screen-brief" class="screen"></section>

  <!-- ------------------------------- battle ----------------------------- -->
  <section id="screen-battle" class="screen battle">
    <canvas id="game" aria-label="Battlefield"></canvas>
    <div id="battle-banner" class="banner"></div>
    <div id="battle-chat" class="battle-chat"></div>
    <button id="battle-quit" class="btn ghost corner" aria-label="Abandon ticket">ABANDON</button>
  </section>

  <!-- ------------------------------ results ----------------------------- -->
  <section id="screen-result" class="screen"></section>

  <!-- ------------------------------- shop ------------------------------ -->
  <section id="screen-shop" class="screen"></section>

  <!-- ------------------------------- base ------------------------------ -->
  <section id="screen-base" class="screen"></section>

  <!-- ------------------------------ settings ---------------------------- -->
  <section id="screen-settings" class="screen"></section>

  <!-- ------------------- kit self-test, behind ?selftest=1 ---------------- -->
  <section id="screen-selftest" class="screen">
    <header class="bar">
      <div class="brand">
        <span class="prompt">$</span>
        <span class="title">packet-defense</span>
        <span class="cursor">_</span>
      </div>
      <div id="summary" class="summary">running checks…</div>
    </header>
    <p class="lede">
      The kit carried over from the previous project, verified in this one.
      Structural checks run on boot. The audio checks need a real gesture,
      because browsers refuse to start audio without one.
    </p>
    <div class="controls">
      <button id="runAudio" class="btn primary">Run audible checks</button>
      <span class="hint-inline">or press A</span>
    </div>
    <main id="results" class="results"></main>
  </section>

  <!--
    Mock ad surface. The web/dev backend in ads.js renders a placeholder
    full-screen ad into this element so the whole ad flow is testable in a
    browser. The element was missing, so mock.overlay() short-circuited: an
    interstitial resolved instantly and a rewarded ad *always* returned false,
    which also meant the rewarded path could not be tested anywhere except on a
    real device.
  -->
  <div id="ad-layer" class="hidden" aria-hidden="true"></div>

</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/tracks.js"></script>
<script src="js/music.js"></script>
<script src="js/ads.js"></script>
<script src="js/purchases.js"></script>
<script src="js/progress.js"></script>
<script src="js/base.js"></script>
<script src="js/map.js"></script>
<script src="js/threats.js"></script>
<script src="js/towers.js"></script>
<script src="js/roads.js"></script>
<script src="js/campaign.js"></script>
<script src="js/levels.js"></script>
<script src="js/story.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
<script src="js/selftest.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#field)"/>
  <rect width="512" height="512" rx="104" fill="url(#grid)"/>

  <!-- the road: a packet trace running toward the shielded core -->
  <path d="M40 322H150l40-40h60l40 40h62"
        fill="none" stroke="#1e3a5f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 322H150l40-40h60l40 40h62"
        fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.55"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12"/>

  <!-- a threat that did not make it -->
  <g transform="translate(92 250) rotate(-18)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#ef4444"/>
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="none" stroke="#7f1d1d" stroke-width="5"/>
    <path d="M-30 -6h60M-8 -20v14M10 -20v14" stroke="#7f1d1d" stroke-width="4" fill="none"/>
  </g>

  <!-- the shield: the base holding the line -->
  <path d="M256 108l104 40v104c0 74-46 118-104 148-58-30-104-74-104-148V148z"
        fill="url(#shield)" fill-opacity="0.94"/>
  <path d="M256 108l104 40v104c0 74-46 118-104 148-58-30-104-74-104-148V148z"
        fill="none" stroke="#082f49" stroke-width="10" stroke-linejoin="round"/>

  <!-- circuit detail inside the shield -->
  <path d="M256 168v96M214 214h84"
        stroke="#082f49" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="300" r="17" fill="#082f49"/>
</svg>
